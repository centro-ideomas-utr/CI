<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Menu Transparente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #000000, #fafafa);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: rgb(255, 255, 255);
    }

    h1 {
      margin: 15px 0;
      font-size: 28px;
    }

    .toggle-btn {
      position: fixed;
      left: 20px;
      top: 20px;
      background: transparent;
      border: transparent;
      color: rgb(255, 255, 255);
      font-size: 22px;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 8px;
      transition: 0.3s ease;
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: white;
      transform: scale(1.05);
    }

    .sidebar {
      position: fixed;
      left: -230px;
      top: 0;
      width: 230px;
      height: 100%;
      background: blur(10px);
      backdrop-filter: blur(10px);
      transition: 0.4s ease;
      padding-top: 60px;
      overflow: hidden;
      box-shadow: 3px 0 10px rgba(0,0,0,0.4);
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      padding: 15px 20px;
      margin: 8px 0;
      border-radius: 8px;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar ul li:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar ul li i {
      width: 25px;
      text-align: center;
      font-size: 18px;
      color: #ffffff;
    }

    .sidebar ul li span {
      font-size: 16px;
    }

    .content {
      margin-top: 80px;
      text-align: center;
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="toggleBtn"><i class="fas fa-bars"></i></button>

  <nav class="sidebar" id="sidebar">
    <ul>
      <li><i class="fas fa-home"></i><span>Home</span></li>
      <li><i class="fas fa-chart-bar"></i><span>Dashboard</span></li>
      <li><i class="fas fa-compass"></i><span>Explore</span></li>
      <li><i class="fas fa-chart-line"></i><span>Analytics</span></li>
      <li><i class="fas fa-gear"></i><span>Settings</span></li>
      <li><i class="fas fa-user"></i><span>Account</span></li>
      <li><i class="fas fa-file-alt"></i><span>Report</span></li>
      <li><i class="fas fa-address-book"></i><span>Contact</span></li>
      <li><i class="fas fa-sign-out-alt"></i><span>Logout</span></li>
    </ul>
  </nav>

  <div class="content">
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
    });
  </script>

</body>
</html>
