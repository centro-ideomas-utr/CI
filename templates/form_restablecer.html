<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Jersey+10+Charted&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Login.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='imagen/ci.png') }}">
    <style>
        .error-message, .success-message {
            background-color: #e74c3c; color: white; padding: 10px;
            border-radius: 5px; margin-bottom: 20px; font-weight: 500;
        }
        .success-message { background-color: #2ecc71; }
    </style>
</head>
<body class="your_css_selector_here"> 
    <main class="contenedor">
        <div class="contenido">
            <h1>Nueva Contraseña</h1>
            
            {% if error %}
            <div id="error-message" class="error-message">{{ error }}</div>
            {% endif %}

            <p style="color: white; margin-bottom: 2rem;">El token es válido. Ingresa tu nueva contraseña segura.</p>

            <form class="formulario-login" action="{{ url_for('restablecer_contrasena', token=token) }}" method="POST">
                <div class="campo nueva_contrasena">
                    <input class="registro_field" type="password" id="nueva_contrasena" name="nueva_contrasena" placeholder="Nueva Contraseña (mín. 8 caracteres)" required minlength="8">
                </div>
                
                <div class="campo confirmar_contrasena">
                    <input class="registro_field" type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="Confirmar Contraseña" required minlength="8">
                </div>

                <div class="campo-boton">
                    <input type="submit" value="Cambiar Contraseña" class="boton boton--primario">
                </div>
            </form>
        </div>
    </main>

    <script>
        document.querySelector('.formulario-login').addEventListener('submit', function(e) {
            const nueva = document.getElementById('nueva_contrasena').value;
            const confirmar = document.getElementById('confirmar_contrasena').value;
            if (nueva !== confirmar) {
                e.preventDefault();
                alert("Las contraseñas no coinciden.");
            }
        });
    </script>
</body>
</html>
