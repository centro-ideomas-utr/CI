<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sedes y Salones</title>
    <link rel="icon" href="{{ url_for('static', filename='imagen/CI.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registromaestros.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<body>

    <div class="navbar">
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <h1>Gestión de Sedes</h1>
        <div class="profile"></div>
    </div>

    <div class="sidebar" id="sidebar">
        <div>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Inscripciones</a></li>
                <li><a href="#">Historial</a></li>
                <li><a href="#">Avisos</a></li>
                <li><a href="#">Listas de Clase</a></li>
            </ul>
        </div>
        <div>
            <ul><li><a href="#" class="logout-btn">Salir</a></li></ul>
        </div>
    </div>

    <div class="page-content">
        <!-- Control de Sedes -->
        <div class="sedes-control" id="sedes-container">
            <h3 style="margin: 0 15px 0 0; color: #3D348B;">Sedes:</h3>
            <div class="sede-wrapper">
                <button class="sede-btn" onclick="selectSede('Centro', this)">Campus Centro</button>
                <button class="delete-sede-btn" onclick="deleteSede(this)"><i class="fas fa-times"></i></button>
            </div>
            <button class="sede-btn add-sede-btn" onclick="addSede()"><i class="fas fa-plus"></i> Añadir Sede</button>
        </div>

        <!-- Área de Trabajo -->
        <div class="workspace" id="workspace">
            
            <!-- Columna Izquierda: Formulario de Asignación -->
            <div class="assignment-panel">
                <h2 id="panel-title">Asignar en Campus Centro</h2>
                <form id="assign-form">
                    <div class="form-group">
                        <label for="salon">Salón:</label>
                        <select id="salon" required>
                            <option value="">Seleccione Salón...</option>
                            <option value="101">Aula 101</option>
                            <option value="102">Aula 102</option>
                            <option value="Lab1">Laboratorio 1</option>
                            <option value="Auditorio">Auditorio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idioma">Idioma:</label>
                        <select id="idioma" required>
                            <option value="Inglés">Inglés</option>
                            <option value="Francés">Francés</option>
                            <option value="Alemán">Alemán</option>
                            <option value="Italiano">Italiano</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="maestro">Maestro:</label>
                        <select id="maestro" required>
                            <option value="Laura Martínez">Laura Martínez</option>
                            <option value="John Smith">John Smith</option>
                            <option value="Emily Jones">Emily Jones</option>
                        </select>
                    </div>
                    
                    <!-- MODIFICACIÓN: Checkboxes para Días -->
                    <div class="form-group">
                        <label>Días:</label>
                        <div class="days-checkbox-group">
                            <label><input type="checkbox" name="dias" value="1"> Lun</label>
                            <label><input type="checkbox" name="dias" value="2"> Mar</label>
                            <label><input type="checkbox" name="dias" value="3"> Mié</label>
                            <label><input type="checkbox" name="dias" value="4"> Jue</label>
                            <label><input type="checkbox" name="dias" value="5"> Vie</label>
                            <label><input type="checkbox" name="dias" value="6"> Sáb</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora de Inicio:</label>
                        <select id="hora" required>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-assign">Guardar Asignación</button>
                    </div>
                </form>
            </div>

            <!-- Columna Derecha: Visualización de Horarios -->
            <div class="schedule-view">
                <div class="schedule-header">
                    <h2>Ocupación de Salones</h2>
                    <div style="font-size: 0.9em; color: #777;">Vista Semanal</div>
                </div>
                
                <!-- Grid de Horario -->
                <div class="timetable" id="timetable">
                    <!-- Headers -->
                    <div class="time-header">Hora</div>
                    <div class="day-header">Lun</div>
                    <div class="day-header">Mar</div>
                    <div class="day-header">Mié</div>
                    <div class="day-header">Jue</div>
                    <div class="day-header">Vie</div>
                    <div class="day-header">Sáb</div>

                    <!-- Fila 08:00 -->
                    <div class="time-slot">08:00</div>
                    <div class="time-slot" id="cell-1-08:00"></div>
                    <div class="time-slot" id="cell-2-08:00"></div>
                    <div class="time-slot" id="cell-3-08:00"></div>
                    <div class="time-slot" id="cell-4-08:00"></div>
                    <div class="time-slot" id="cell-5-08:00"></div>
                    <div class="time-slot" id="cell-6-08:00"></div>

                    <!-- Fila 09:00 -->
                    <div class="time-slot">09:00</div>
                    <div class="time-slot" id="cell-1-09:00"></div>
                    <div class="time-slot" id="cell-2-09:00"></div>
                    <div class="time-slot" id="cell-3-09:00"></div>
                    <div class="time-slot" id="cell-4-09:00"></div>
                    <div class="time-slot" id="cell-5-09:00"></div>
                    <div class="time-slot" id="cell-6-09:00"></div>

                     <!-- Fila 10:00 -->
                    <div class="time-slot">10:00</div>
                    <div class="time-slot" id="cell-1-10:00"></div>
                    <div class="time-slot" id="cell-2-10:00"></div>
                    <div class="time-slot" id="cell-3-10:00"></div>
                    <div class="time-slot" id="cell-4-10:00"></div>
                    <div class="time-slot" id="cell-5-10:00"></div>
                    <div class="time-slot" id="cell-6-10:00"></div>
                     
                     <!-- Fila 11:00 -->
                    <div class="time-slot">11:00</div>
                    <div class="time-slot" id="cell-1-11:00"></div>
                    <div class="time-slot" id="cell-2-11:00"></div>
                    <div class="time-slot" id="cell-3-11:00"></div>
                    <div class="time-slot" id="cell-4-11:00"></div>
                    <div class="time-slot" id="cell-5-11:00"></div>
                    <div class="time-slot" id="cell-6-11:00"></div>

                    <!-- Fila 12:00 -->
                    <div class="time-slot">12:00</div>
                    <div class="time-slot" id="cell-1-12:00"></div>
                    <div class="time-slot" id="cell-2-12:00"></div>
                    <div class="time-slot" id="cell-3-12:00"></div>
                    <div class="time-slot" id="cell-4-12:00"></div>
                    <div class="time-slot" id="cell-5-12:00"></div>
                    <div class="time-slot" id="cell-6-12:00"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>Contacto: info@centroidiomas.edu | Tel: (123) 456-7890</p>
        </div>
    </footer>

  <script src="{{ url_for('static', filename='js/registromaestro.js') }}"></script>

</body>
</html>
