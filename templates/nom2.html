<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Expedientes</title>
    
    <style>
        /* Adaptación al tema oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Fondo negro oscuro */
            color: #f0f0f0; /* Texto claro */
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 80%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        /* Estilos de la tabla */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }

        .data-table th, .data-table td {
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #444;
        }

        .data-table th {
            background-color: #333; /* Encabezado más claro que el fondo */
            font-weight: 600;
            color: #00a859; /* Verde de acento del diseño anterior */
            font-size: 1.1em;
            white-space: nowrap; /* Evita que el texto se rompa */
        }
        
        .data-table td {
            background-color: #222;
        }

        .data-table tr:hover td {
            background-color: #2c2c2c;
        }

        /* Estilos para los cuadros de expedientes */
        .expedientes-container {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .square {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.4);
        }

        /* Colores de los cuadros */
        .square.blue-dark { background-color: #3f51b5; } /* Azul oscuro */
        .square.purple { background-color: #9c27b0; } /* Morado */
        .square.pink { background-color: #e91e63; } /* Rosa magenta */
        .square.blue-light { background-color: #2196f3; } /* Azul claro */
        .square.green { background-color: #4CAF50; } /* Verde para "Revisar datos" */
        .square.red { background-color: #ff0000; }
        /* Estilo del botón */
        .btn-imprimir {
            padding: 15px 30px;
            background: #f0f0f0; /* Color claro para destacar */
            color: #1a1a1a;
            border: 1px solid #888;
            border-radius: 50px; /* Forma ovalada */
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 600;
        }

        .btn-imprimir:hover {
            background: #fff;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <div class="container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Nombre</th>
                    <th>Expedientes</th>
                    <th>Revisar datos de Facturación</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>4444</td>
                    <td>Juan</td>
                    <td>
                        <div class="expedientes-container">
                            <div class="square blue-dark"></div>
                            <div class="square purple"></div>
                            <div class="square pink"></div>
                        <!-- <div class="square blue-light"></div> -->
                        </div>
                    </td>
                    <td>
                        <div class="expedientes-container">
                            <div class="square green"></div>

                        </div>
                    </td>
                </tr>
                <tr>
                    <td>5555</td>
                    <td>Josefina</td>
                    <td>
                        <div class="expedientes-container">
                            <div class="square blue-dark"></div>
                            <div class="square purple"></div>
                            <div class="square pink"></div>
                           <!-- <div class="square blue-light"></div> -->
                        </div>
                    </td>
                    <td>
                        <div class="expedientes-container">
                            <div class="square red"></div>

                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-imprimir" onclick="window.print()">
        Imprimir
    </button>
    
    <div style="margin-top: 50px; font-size: 2em; color: #555;">
        <span>•</span><span style="margin: 0 15px; color: #f0f0f0;">•</span><span>•</span>
    </div>

</body>
</html>
