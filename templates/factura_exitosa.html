<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Timbrada</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #e6ffed; color: #004c99; }
        h1 { color: #00a859; font-size: 2.5em; }
        .uuid { margin: 20px auto; padding: 15px; background-color: #fff; border: 1px solid #00a859; display: block; max-width: 500px; font-weight: bold; }
        .action-buttons { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-download { background-color: #004c99; color: white; }
        .btn-back { background-color: #ccc; color: #333; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <h1>Factura Generada y Timbrada con Éxito</h1>
    <p>El Comprobante Fiscal Digital por Internet (CFDI) se ha emitido con el identificador de prueba.</p>
    <p><strong>UUID (Folio Fiscal):</strong></p>
    <div class="uuid">{{ uuid }}</div>
    
    <div class="action-buttons">
        <!-- Estos enlaces llaman a tu ruta de simulación de descarga en app.py -->
        <a href="/factura/prueba/{{ uuid }}/xml" class="btn btn-download">Descargar XML (Prueba)</a>
        <a href="/factura/prueba/{{ uuid }}/pdf" class="btn btn-download">Descargar PDF (Prueba)</a>
    </div>
    
    <a href="/" class="btn-back">Volver a la página principal</a>
</body>
</html>
